<!DOCTYPE html>
<html>
  <head>
    <title>Advanced Functions</title>
  </head>
  <body>
    <h1>Advanced Functions</h1>

    <button class="js-button" onclick="
      updateButton();
    ">Start</button><br><br>

    <button class="js-button" onclick="
      displayMessage();
    ">Add to cart</button>

    <p class="js-message"></p>

    <!--
      Note: This is just a sample solution. Other
      solutions are possible so don't worry if
      your solution looks different.
    -->
    <button onclick="
      messages++;
      displayNotification();
    ">Add</button>

    <button onclick="
      if (messages > 0) {
        messages--;

        // If there are no new messages, stop displaying
        // the notification in the tab.
        if (messages === 0) {
          stopNotification();
        }
      }
    ">Remove</button>

    <script src="scripts/advanced-functions.js"></script>
  </body>
</html>
